<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.discordapp.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MyGamesThing</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="../../assets/icon.png" width="39" height="39" alt=""><div>MyGamesThing<small>YOUR ACTIVITY, IN ORDER.</small></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      <button data-page="dashboard" class="active"><span>◫</span>Dashboard</button>
      <button data-page="library"><span>▦</span>Library<span id="library-count" class="nav-count">—</span></button>
      <button data-page="queues"><span>☷</span>Queues</button>
      <button data-page="history"><span>◷</span>History</button>
      <button data-page="settings"><span>⚙</span>Settings</button>
    </nav>
    <div class="sidebar-bottom"><div class="status-dot"></div><span id="sidebar-status">Ready when you are</span><small>MyGamesThing <span>v0.1.0</span></small></div>
  </aside>
  <div class="workspace"><header class="topbar"><span id="breadcrumb">Workspace <b>/</b> Dashboard</span><span id="catalog-status" class="badge">Loading game catalog…</span></header><main id="main"></main></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal"><form id="modal-form"><div id="modal-content"></div><div class="dialog-actions"><button type="button" id="modal-cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
  <script type="module" src="app.js"></script>
</body></html>
